<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello, Electrobun</title>
<style>
  /* Bare-DRM kiosk note: the webcam used for off-Pi visual confirmation
     reads the TTY's black background as washed-out navy on this glossy
     bar panel. The previous navy gradient was therefore indistinguishable
     from "nothing rendered." Orange-on-charcoal removes that ambiguity. */
  :root {
    --bg-start: #cc3300;
    --bg-end:   #ff8a00;
    --accent:   #1a1a1a;
    --text:     #fff5e6;
  }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: linear-gradient(90deg, var(--bg-start), var(--bg-end));
    color: var(--text);
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5em;
  }
  .greeting {
    font-size: clamp(48px, 12vmin, 120px);
    font-weight: 800;
    letter-spacing: 2px;
    margin: 0;
  }
  .dot { color: var(--accent); }
  .sub {
    font-size: clamp(20px, 4vmin, 36px);
    opacity: 0.85;
    display: flex;
    align-items: baseline;
    gap: 0.5em;
  }
  .count {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    min-width: 3ch;
    text-align: right;
  }
  .card button {
    margin-top: 0.6em;
    padding: 0.7em 1.6em;
    font-size: clamp(28px, 5.5vmin, 48px);
    font-weight: 600;
    color: var(--bg-start);
    background: var(--accent);
    border: none;
    border-radius: 9999px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .card button:active { transform: scale(0.95); }
  .nav-test {
    display: flex;
    gap: 1em;
    margin-top: 0.6em;
    align-items: center;
  }
  /* Big touch targets for the 7" bar panel — both <button> so the box
     metrics + baseline behavior match without fighting UA defaults. */
  .nav-test button {
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    font: inherit;
    font-size: clamp(28px, 5.5vmin, 48px);
    padding: 0.6em 1.4em;
    color: var(--text);
    background: transparent;
    border: 3px solid var(--text);
    border-radius: 9999px;
    box-shadow: none;
    line-height: 1;
    cursor: pointer;
  }
</style>
<!-- Script src is relative so the same file loads correctly under both:
     - Electrobun's views:// URL scheme (at build time it resolves to the bundled JS)
     - Plain file:// (pre-integration standalone tests; compile with
       `bun build src/main/index.ts --outfile src/main/index.js` first) -->
<script src="./index.js" defer></script>
</head>
<body>
  <div class="card">
    <h1 class="greeting">Hello, Electrobun<span class="dot">.</span></h1>
    <div class="sub">
      Frame
      <span id="frames" class="count">0</span>
      · Clicks
      <span id="clicks" class="count">0</span>
    </div>
    <button id="press">Press me</button>
    <!-- Navigation smoke test (linux-wpe §16). -->
    <div class="nav-test">
      <button id="nav-page2" type="button"
              onclick="window.location='views://main/page2.html'">tap: page 2</button>
      <button id="nav-refresh" type="button"
              onclick="window.location='views://main/index.html?t='+Date.now()">tap: self-reload</button>
    </div>
  </div>
</body>
</html>
