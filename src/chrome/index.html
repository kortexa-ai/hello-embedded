<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chrome</title>
<style>
  /* Chrome bar — separate webview rendered above the main view via the WPE
     multi-view compositor. alwaysTopmost flag set via partition convention
     ("__electrobun_chrome__") on the BrowserView. */
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: #1a1a1a;
    color: #fff5e6;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .title {
    padding-left: 1em;
    font-size: clamp(14px, 3.5vmin, 22px);
    font-weight: 600;
    color: #ff8a00;
  }
  .actions {
    display: flex;
    gap: 0.4em;
    padding-right: 0.4em;
  }
  button {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: transparent;
    color: #fff5e6;
    font-size: clamp(20px, 5vmin, 30px);
    font-weight: 700;
    width: clamp(36px, 9vmin, 56px);
    height: 100%;
    cursor: pointer;
    line-height: 1;
  }
  button:active { background: #333; }
  #close:active { background: #d33; }
</style>
</head>
<body>
  <div class="title">hello-embedded</div>
  <div class="actions">
    <button id="close" type="button" aria-label="close">×</button>
  </div>
<script>
  // Reuse the internal RPC channel that auto-inject chrome already wired
  // up — Bun side has a "electrobunChromeQuit" handler that calls
  // Utils.quit(). Sending the message directly through internalBridge
  // avoids needing the full RPC stack from this tiny chrome view.
  document.getElementById("close").addEventListener("click", function () {
    var bridge = window.__electrobunInternalBridge ||
                 (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.internalBridge);
    if (!bridge) {
      console.warn("[chrome] no internalBridge available");
      return;
    }
    var payload = JSON.stringify({
      type: "request",
      id: "chrome-quit-" + Date.now(),
      method: "message",
      params: { type: "electrobunChromeQuit" }
    });
    if (typeof bridge.postMessage === "function") {
      bridge.postMessage(payload);
    }
  });
</script>
</body>
</html>
