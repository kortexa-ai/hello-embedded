<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js · Hello Electrobun</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #040812;
        color: #f8fafc;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: fixed;
        z-index: 1;
        top: 18px;
        left: 22px;
        padding: 12px 16px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 10px;
        background: rgb(4 8 18 / 72%);
        box-shadow: 0 10px 32px rgb(0 0 0 / 28%);
        backdrop-filter: blur(8px);
        pointer-events: none;
      }

      .hud strong {
        display: block;
        color: #ff9c3b;
        font-size: 18px;
      }

      .hud span {
        display: block;
        margin-top: 5px;
        color: #b8c5d6;
        font-size: 13px;
      }

      .back {
        position: fixed;
        z-index: 1;
        top: 18px;
        right: 22px;
        min-width: 120px;
        min-height: 52px;
        border: 1px solid rgb(255 255 255 / 26%);
        border-radius: 10px;
        background: rgb(4 8 18 / 76%);
        color: #f8fafc;
        font: inherit;
        font-size: 17px;
      }

      .back:active {
        background: rgb(255 156 59 / 35%);
      }

      .error {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 40px;
        color: #ffb4a2;
        font-size: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <strong>three.js proving ground</strong>
      <span id="stats">waking the geometry goblin…</span>
    </div>
    <button class="back" type="button" onclick="location.href='./index.html'">
      ← back
    </button>
    <script type="module" src="./three.ts"></script>
  </body>
</html>
